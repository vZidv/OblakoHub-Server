services:
  cloud:
    build: .
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
    volumes:
      - cloud-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      CLOUD_IP: "${CLOUD_IP:?Run bash install.sh}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # TLS must be ready before starting the cloud.
    restart: unless-stopped

volumes:
  cloud-data:
  caddy-data:
  caddy-config:
